<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词本</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>单词本</h1>
    <nav>
      <button data-view="view-add">录入</button>
      <button data-view="view-book">单词本</button>
      <button data-view="view-quiz">默写</button>
      <button data-view="view-wrong">错题本</button>
      <button data-view="view-settings">设置</button>
    </nav>
  </header>

  <main>
    <!-- 录入视图 -->
    <section id="view-add" class="view">
      <h2>录入单词</h2>
      <div class="row">
        <input type="text" id="add-input" placeholder="输入英文单词，回车查询">
        <button id="btn-query">查询并加入</button>
      </div>
      <!-- 查询结果预览 -->
      <div id="add-preview" style="display:none"></div>
      <!-- 手动录入表单 -->
      <div id="add-manual" style="display:none">
        <h3>手动录入</h3>
        <div class="row"><input type="text" id="manual-word" placeholder="单词"></div>
        <div class="manual-row">
          <input id="manual-pos1" placeholder="词性，如 n."><input id="manual-mean1" placeholder="释义">
        </div>
        <div class="manual-row">
          <input id="manual-pos2" placeholder="词性，如 v."><input id="manual-mean2" placeholder="释义">
        </div>
        <div class="manual-row">
          <input id="manual-pos3" placeholder="词性，如 adj."><input id="manual-mean3" placeholder="释义">
        </div>
        <button id="btn-manual-add">确认手动加入</button>
      </div>
    </section>

    <!-- 单词本视图 -->
    <section id="view-book" class="view" style="display:none">
      <h2>单词本</h2>
      <div class="row">
        <input type="text" id="book-search" placeholder="搜索单词...">
      </div>
      <div id="book-list"></div>
    </section>

    <!-- 默写视图 -->
    <section id="view-quiz" class="view" style="display:none">
      <h2>默写</h2>
      <div id="quiz-setup">
        <div class="form-group">
          <label>默写范围</label>
          <select id="quiz-scope">
            <option value="all">全部单词</option>
            <option value="3days">近三天</option>
            <option value="7days">近七天</option>
            <option value="random">随机抽默</option>
            <option value="wrongbook">错题本</option>
          </select>
        </div>
        <div class="form-group">
          <label>方向</label>
          <select id="quiz-mode">
            <option value="c2e">英译汉（给英文写中文）</option>
            <option value="e2c">汉译英（给中文写英文）</option>
          </select>
        </div>
        <button id="btn-start-quiz">开始默写</button>
        <p id="quiz-message" style="color:#c00"></p>
      </div>

      <div id="quiz-area" style="display:none">
        <div class="row" style="justify-content:space-between;align-items:center">
          <p id="quiz-progress" style="margin:0"></p>
          <button type="button" id="quiz-exit">返回</button>
        </div>
        <div id="quiz-prompt"></div>
        <div class="row">
          <input type="text" id="quiz-input" placeholder="在此输入答案">
          <button id="quiz-submit">提交</button>
        </div>
        <div id="quiz-result" style="display:none"></div>
        <button id="quiz-next" style="display:none">下一题</button>
      </div>

      <div id="quiz-summary" style="display:none"></div>
    </section>

    <!-- 错题本视图 -->
    <section id="view-wrong" class="view" style="display:none">
      <h2>错题本</h2>
      <div id="wrong-list"></div>
      <button id="btn-quiz-wrong">开始默写错题本</button>
    </section>

    <!-- 设置视图 -->
    <section id="view-settings" class="view" style="display:none">
      <h2>设置</h2>
      <div class="form-group">
        <label>大模型服务商</label>
        <select id="set-provider">
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">通义千问</option>
          <option value="custom">自定义（兼容 OpenAI 格式）</option>
        </select>
      </div>
      <div class="form-group" id="group-baseurl" style="display:none">
        <label>Base URL</label>
        <input type="text" id="set-baseurl" placeholder="https://api.example.com/v1/chat/completions">
      </div>
      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="set-model" value="deepseek-chat">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="set-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label>随机抽默数量</label>
        <input type="number" id="set-randomcount" value="10" min="1" max="100">
      </div>
      <button id="btn-save-settings">保存设置</button>
      <hr>
      <h3>数据备份</h3>
      <button id="btn-export">导出备份</button>
      <button id="btn-import">导入备份</button>
      <p class="hint">提示：数据存储在浏览器 localStorage，清除缓存会丢失，请定期导出备份。若浏览器拦截 API 跨域请求，请在项目目录运行 <code>python -m http.server 8000</code> 后访问 http://localhost:8000 。</p>
    </section>
  </main>

  <script src="js/data_cet.js"></script>
  <script src="js/seed_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
